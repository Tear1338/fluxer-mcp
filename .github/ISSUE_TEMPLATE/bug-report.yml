name: Bug Report
description: Report a bug in Fluxer MCP (Cloud or self-hosted)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never include `FLUXER_TOKEN`, `FLUXER_MCP_ACCESS_TOKEN`, webhook tokens, or private community data.
  - type: input
    id: version
    attributes:
      label: Fluxer MCP version
      description: Output of `fluxer-mcp --version`
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: instance
    attributes:
      label: Fluxer Instance Type
      options:
        - Fluxer Cloud (https://api.fluxer.app)
        - Self-Hosted Fluxer
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include tool name, redacted inputs, and observed error code.
    validations:
      required: true
  - type: checkboxes
    id: redaction
    attributes:
      label: Security Checklist
      options:
        - label: I have redacted all bot tokens, webhook tokens, and private secrets.
          required: true
